<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Analyzer - WORKING</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
            font-size: 16px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #3498db;
            background: #f8f9fa;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background: #219a52;
        }
        
        .results {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .metric {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        
        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 ANALISIS KEUANGAN</h1>
        <p class="subtitle">By Khaerul Ananda - 100% Working</p>
        
        <div class="input-group">
            <label for="namaPerusahaan">🏢 Nama Perusahaan</label>
            <input type="text" id="namaPerusahaan" placeholder="Contoh: PT Sukses Makmur" value="PT Contoh Sukses">
        </div>
        
        <div class="input-group">
            <label for="pendapatan">💰 Pendapatan (Rp)</label>
            <input type="number" id="pendapatan" placeholder="Contoh: 100000000" value="100000000">
        </div>
        
        <div class="input-group">
            <label for="hpp">📦 HPP (Harga Pokok Penjualan)</label>
            <input type="number" id="hpp" placeholder="Contoh: 60000000" value="60000000">
        </div>
        
        <div class="input-group">
            <label for="biayaOperasional">⚡ Biaya Operasional</label>
            <input type="number" id="biayaOperasional" placeholder="Contoh: 20000000" value="20000000">
        </div>
        
        <button onclick="hitungAnalisis()">🚀 ANALISIS SEKARANG</button>
        
        <div id="hasil" class="results">
            <h3>📊 HASIL ANALISIS</h3>
            
            <div class="metric">
                <strong>Laba Kotor</strong>
                <div class="metric-value" id="labaKotor">-</div>
            </div>
            
            <div class="metric">
                <strong>Laba Bersih</strong>
                <div class="metric-value" id="labaBersih">-</div>
            </div>
            
            <div class="metric">
                <strong>Margin Laba Bersih</strong>
                <div class="metric-value" id="marginBersih">-</div>
            </div>
        </div>
    </div>

    <script>
        function hitungAnalisis() {
            // Ambil nilai dari input
            const namaPerusahaan = document.getElementById('namaPerusahaan').value;
            const pendapatan = parseFloat(document.getElementById('pendapatan').value) || 0;
            const hpp = parseFloat(document.getElementById('hpp').value) || 0;
            const biayaOperasional = parseFloat(document.getElementById('biayaOperasional').value) || 0;
            
            // Validasi
            if (!namaPerusahaan) {
                alert('⚠️ Harap isi nama perusahaan!');
                return;
            }
            
            if (pendapatan === 0) {
                alert('⚠️ Harap isi pendapatan!');
                return;
            }
            
            // Hitung
            const labaKotor = pendapatan - hpp;
            const labaBersih = labaKotor - biayaOperasional;
            const marginBersih = pendapatan > 0 ? ((labaBersih / pendapatan) * 100).toFixed(2) : 0;
            
            // Tampilkan hasil
            document.getElementById('labaKotor').textContent = formatRupiah(labaKotor);
            document.getElementById('labaBersih').textContent = formatRupiah(labaBersih);
            document.getElementById('marginBersih').textContent = marginBersih + '%';
            
            // Tampilkan section hasil
            document.getElementById('hasil').style.display = 'block';
            
            // Scroll ke hasil
            document.getElementById('hasil').scrollIntoView({ behavior: 'smooth' });
            
            // Alert sukses
            alert('✅ ANALISIS BERHASIL!\n\n' +
                  'Perusahaan: ' + namaPerusahaan + '\n' +
                  'Laba Bersih: ' + formatRupiah(labaBersih) + '\n' +
                  'Margin: ' + marginBersih + '%');
        }
        
        function formatRupiah(angka) {
            return 'Rp ' + angka.toLocaleString('id-ID');
        }
        
        // Test input bisa diklik
        console.log('Aplikasi siap digunakan!');
        
        // Focus ke input pertama
        document.getElementById('namaPerusahaan').focus();
    </script>
</body>
</html>
